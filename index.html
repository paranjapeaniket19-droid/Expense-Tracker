<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker Pro v7</title>
<style>
body{font-family:Arial;background:#f4f6f9;padding:20px}
.container{max-width:1000px;margin:auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
h1{margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select,button{padding:8px;border-radius:6px;border:1px solid #ccc}
button{background:#0b6ef3;color:#fff;border:none;cursor:pointer}
.btn-reset{background:#ffc107;color:#000;font-weight:600}
.btn-success{background:#28a745}
.balance{font-size:20px;font-weight:bold;color:#0b6ef3}
.small{font-size:13px;color:#555}
.credit{color:green;font-weight:bold}
.debit{color:red;font-weight:bold}
.balance-pos{color:green;font-weight:bold}
.balance-neg{color:red;font-weight:bold}
table{width:100%;margin-top:15px;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee}
</style>
</head>
<body>

<div class="container">
<h1>Expense Tracker</h1>

<div class="row">
<input type="number" id="salaryInput" placeholder="Add Monthly Salary">
<button onclick="setNewMonth()">Start New Month</button>
<button class="btn-reset" onclick="resetAll()">Reset All</button>
</div>

<div class="small">Carry Forward: ₹<span id="carryForward">0</span></div>
<div class="small">Salary Added: ₹<span id="salaryAdded">0</span></div>
<div class="small">Month Start Balance: ₹<span id="startBalance">0</span></div>
<div class="balance">Live Balance: ₹<span id="liveBalance">0</span></div>

<div class="row">
<input type="date" id="date">
<input type="number" id="amount" placeholder="Amount">
<input type="text" id="desc" placeholder="Description">
<select id="type">
<option value="debit" selected>Debit</option>
<option value="credit">Credit</option>
</select>
<button onclick="addEntry()">Add</button>
<button class="btn-success" onclick="downloadCSV()">Download CSV</button>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Amount</th>
<th>Description</th>
<th>Type</th>
<th>Balance</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>
const KEY="tracker_v7";
let state=JSON.parse(localStorage.getItem(KEY))||{
carryForward:0,
salaryAdded:0,
startingBalance:0,
entries:[]
};

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function today(){return new Date().toISOString().slice(0,10)}
document.getElementById("date").value=today();

function computeBalance(){
let bal=state.startingBalance;
state.entries.forEach(e=>{
bal+= (e.type==="credit"?e.amount:-e.amount);
});
return bal;
}

function setNewMonth(){
const salary=parseFloat(document.getElementById("salaryInput").value);
if(isNaN(salary)) return alert("Enter salary");

const closing=computeBalance();

state.carryForward=closing;
state.salaryAdded=salary;
state.startingBalance=closing+salary;
state.entries=[];

document.getElementById("salaryInput").value="";

save();
render();
}

function addEntry(){
if(state.startingBalance===0) return alert("Start month first");

const date=document.getElementById("date").value;
const amount=parseFloat(document.getElementById("amount").value);
const desc=document.getElementById("desc").value;
const type=document.getElementById("type").value;

if(!amount||!desc) return;

state.entries.push({id:Date.now(),date,amount,desc,type});
state.entries.sort((a,b)=>a.date.localeCompare(b.date));

document.getElementById("amount").value="";
document.getElementById("desc").value="";

save();
render();
}

function editEntry(id){
const e=state.entries.find(x=>x.id===id);
document.getElementById("date").value=e.date;
document.getElementById("amount").value=e.amount;
document.getElementById("desc").value=e.desc;
document.getElementById("type").value=e.type;

state.entries=state.entries.filter(x=>x.id!==id);
}

function deleteEntry(id){
state.entries=state.entries.filter(e=>e.id!==id);
save();
render();
}

function resetAll(){
localStorage.removeItem(KEY);
location.reload();
}

function render(){
let tbody=document.getElementById("tbody");
tbody.innerHTML="";

let running=state.startingBalance;

state.entries.forEach(e=>{
running+= (e.type==="credit"?e.amount:-e.amount);

let tr=document.createElement("tr");
tr.innerHTML=`
<td>${e.date}</td>
<td class="${e.type}">${e.type==="credit"?"+":"-"}₹${e.amount}</td>
<td>${e.desc}</td>
<td>${e.type}</td>
<td class="${running>=0?"balance-pos":"balance-neg"}">₹${running.toFixed(2)}</td>
<td>
<button onclick="editEntry(${e.id})">Edit</button>
<button onclick="deleteEntry(${e.id})">Delete</button>
</td>`;

tbody.appendChild(tr);
});

document.getElementById("carryForward").innerText=state.carryForward.toFixed(2);
document.getElementById("salaryAdded").innerText=state.salaryAdded.toFixed(2);
document.getElementById("startBalance").innerText=state.startingBalance.toFixed(2);
document.getElementById("liveBalance").innerText=running.toFixed(2);
}

function downloadCSV(){
let csv="Date,Amount,Description,Type\n";
state.entries.forEach(e=>{
csv+=`${e.date},${e.amount},${e.desc},${e.type}\n`;
});
let blob=new Blob([csv]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="expenses.csv";
a.click();
}

render();
</script>

</body>
</html>
